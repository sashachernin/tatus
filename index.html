<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatus – בקרוב</title>
<meta name="description" content="Tatus – האתר החדש שלנו יעלה לאוויר ממש בקרוב.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231CC7B8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF}
a{color:#0F2A3D}a:hover{color:#4A6273}
.tatus-scene{position:relative;width:560px;height:240px;flex:0 0 auto}
.tatus-plane{position:absolute;top:0;left:0;width:40px;height:40px;offset-path:path('M520 190 Q280 -40 40 190');offset-rotate:auto;offset-anchor:center;offset-distance:55%;animation:tatus-fly 9s ease-in-out infinite}
@keyframes tatus-fly{0%{offset-distance:0%;opacity:0}10%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
.tatus-trail{animation:tatus-dash 3s linear infinite}
@keyframes tatus-dash{to{stroke-dashoffset:-36}}
.tatus-sun{animation:tatus-rise 6s ease-in-out infinite alternate}
@keyframes tatus-rise{from{transform:translateY(8px)}to{transform:translateY(-4px)}}
.tatus-wave{animation:tatus-wave 4s linear infinite}
.tatus-wave-slow{animation:tatus-wave 7s linear infinite reverse}
@keyframes tatus-wave{to{stroke-dashoffset:-60}}
.tatus-cloud-a{animation:tatus-drift 14s ease-in-out infinite alternate}
.tatus-cloud-b{animation:tatus-drift 18s ease-in-out infinite alternate-reverse}
@keyframes tatus-drift{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
.tatus-in{animation:tatus-in 1.2s ease-out both}
.tatus-in-2{animation:tatus-in 1.2s ease-out .25s both}
.tatus-in-3{animation:tatus-in 1.2s ease-out .5s both}
@keyframes tatus-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:640px){.tatus-scene{transform:scale(.6);margin:-48px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div dir="rtl" style="min-height: 100vh; box-sizing: border-box; background: #FFFFFF; color: #0F2A3D; font-family: Heebo, 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; padding: 32px 6vw">

<header style="display: flex; justify-content: flex-start; align-items: center">
<span dir="ltr" style="font-size: 28px; font-weight: 700; letter-spacing: 0.04em">Tatus</span>
</header>

<main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 24px; padding: 48px 0">
<div class="tatus-scene" aria-hidden="true">
<svg width="560" height="240" viewBox="0 0 560 240" fill="none" style="position: absolute; top: 0; left: 0">
<g class="tatus-cloud-a">
<path d="M120 70 a14 14 0 0 1 26 -6 a18 18 0 0 1 32 10 a10 10 0 0 1 0 20 h-56 a12 12 0 0 1 -2 -24 z" stroke="#A8EEE7" stroke-width="2" stroke-linejoin="round"></path>
</g>
<g class="tatus-cloud-b">
<path d="M390 52 a11 11 0 0 1 20 -4 a14 14 0 0 1 25 8 a8 8 0 0 1 0 16 h-44 a10 10 0 0 1 -1 -20 z" stroke="#A8EEE7" stroke-width="2" stroke-linejoin="round"></path>
</g>
<path class="tatus-trail" d="M520 190 Q280 -40 40 190" stroke="#9FB3C2" stroke-width="1.5" stroke-dasharray="2 10" stroke-linecap="round"></path>
<circle cx="520" cy="190" r="4" fill="#9FB3C2"></circle>
<circle cx="40" cy="190" r="4" fill="#1CC7B8"></circle>
<g class="tatus-sun">
<path d="M236 200 A44 44 0 0 1 324 200" stroke="#1CC7B8" stroke-width="2.5" stroke-linecap="round"></path>
<line x1="280" y1="138" x2="280" y2="128" stroke="#1CC7B8" stroke-width="2" stroke-linecap="round"></line>
<line x1="240" y1="156" x2="233" y2="149" stroke="#1CC7B8" stroke-width="2" stroke-linecap="round"></line>
<line x1="320" y1="156" x2="327" y2="149" stroke="#1CC7B8" stroke-width="2" stroke-linecap="round"></line>
</g>
<rect x="0" y="201" width="560" height="39" fill="#FFFFFF"></rect>
<line x1="20" y1="200" x2="540" y2="200" stroke="#0F2A3D" stroke-width="1.5" stroke-linecap="round"></line>
<line class="tatus-wave" x1="110" y1="214" x2="450" y2="214" stroke="#1CC7B8" stroke-width="2" stroke-dasharray="40 20" stroke-linecap="round"></line>
<line class="tatus-wave-slow" x1="190" y1="228" x2="370" y2="228" stroke="#A8EEE7" stroke-width="2" stroke-dasharray="30 30" stroke-linecap="round"></line>
</svg>
<div class="tatus-plane">
<svg width="40" height="40" viewBox="-20 -20 40 40">
<path d="M18 0 C18 -1.6 16 -2.2 14 -2.2 L4 -2.2 L-5 -16 L-9 -16 L-3 -2.2 L-11 -2.2 L-14.5 -7 L-17.5 -7 L-15.5 -1.5 L-15.5 1.5 L-17.5 7 L-14.5 7 L-11 2.2 L-3 2.2 L-9 16 L-5 16 L4 2.2 L14 2.2 C16 2.2 18 1.6 18 0 Z" fill="#0F2A3D"></path>
</svg>
</div>
</div>

<span class="tatus-in" style="font-size: 15px; font-weight: 500; letter-spacing: 0.3em; color: #0B7A72">בקרוב</span>

<h1 class="tatus-in-2" style="margin: 0; font-size: clamp(40px, 6.5vw, 88px); font-weight: 200; line-height: 1.1; max-width: 900px">המסע הבא שלכם מתחיל כאן</h1>

<div class="tatus-in-3" aria-hidden="true" style="width: 72px; height: 3px; border-radius: 2px; background: #1CC7B8"></div>

<p class="tatus-in-3" style="margin: 0; font-size: clamp(17px, 1.6vw, 20px); font-weight: 300; line-height: 1.7; color: #4A6273; max-width: 560px">אנחנו מכינים עבורכם דרך חדשה לתכנן חופשות וטיולים. האתר של Tatus יעלה לאוויר ממש בקרוב.</p>
</main>

<footer style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 300; color: #5F7686">
<span>© <span dir="ltr">Tatus</span>. כל הזכויות שמורות.</span>
<span dir="ltr" style="font-size: 12px">Created by Sasha Chernin</span>
</footer>

</div>
</body>
</html>
